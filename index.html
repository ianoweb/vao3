        var page = window.location.origin + window.location.pathname.replace(/index\.html$/, "");

        function add(tag, attrs) {

          for (var key in attrs) el.setAttribute(key, attrs[key]);
          head.appendChild(el);
        }
        add("link", { rel: "canonical", href: page });
        add("meta", { property: "og:url", content: page });
        add("meta", { property: "og:image", content: image });
        add("meta", { name: "twitter:image", content: image });
      })();
